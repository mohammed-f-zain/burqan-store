name: Check Odoo webhook secret alignment

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Compare Burqan vs Odoo webhook secrets (hashes only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            BURQAN_ENV="${{ secrets.DEPLOY_PATH }}/packages/api/.env"
            B="$(grep -E '^ODOO_WEBHOOK_SECRET=' "$BURQAN_ENV" | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^["'\'']//;s/["'\'']$//')"
            echo "burqan_secret_len=${#B}"
            echo "burqan_secret_sha256=$(printf '%s' "$B" | sha256sum | awk '{print $1}')"

            # Common Odoo locations on same host
            FOUND=0
            for F in \
              /etc/odoo/odoo.conf \
              /opt/odoo/odoo.conf \
              /var/lib/odoo/.odoorc \
              /root/odoo.conf \
              /home/*/odoo.conf \
              /opt/odoo/*/odoo.conf \
              /etc/odoo/*.conf
            do
              for G in $F; do
                [[ -f "$G" ]] || continue
                if grep -qiE 'webhook_secret|burqan' "$G" 2>/dev/null; then
                  echo "found_config=$G"
                  FOUND=1
                fi
              done
            done

            # Docker / compose env files
            for G in $(find /opt /root /home /var/lib /srv -maxdepth 4 \( -name '*.env' -o -name 'docker-compose*.yml' -o -name 'odoo.conf' \) 2>/dev/null | head -80); do
              if grep -qiE 'webhook_secret|ODOO_WEBHOOK|burqan.webhook' "$G" 2>/dev/null; then
                echo "found_file=$G"
                FOUND=1
                # Extract candidate without printing value
                VAL="$(grep -iE 'webhook_secret|ODOO_WEBHOOK_SECRET' "$G" | head -1 | sed -E 's/.*=//;s/.*: *//;s/["'\'']//g' | tr -d '\r' | awk '{$1=$1};1')"
                if [[ -n "$VAL" && "$VAL" != *" "* ]]; then
                  echo "candidate_from=$G len=${#VAL} sha256=$(printf '%s' "$VAL" | sha256sum | awk '{print $1}')"
                  if [[ "$VAL" == "$B" ]]; then
                    echo "MATCH=yes source=$G"
                  else
                    echo "MATCH=no source=$G"
                  fi
                fi
              fi
            done

            # Quick auth probe (no secret printed)
            CODE="$(curl -sS -o /tmp/odoo-auth.txt -w '%{http_code}' \
              -X POST 'https://erp.burqan.tech/burqan/webhook/product' \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${B}" \
              -d '{"event":"product.updated","product":{"id":10,"name":"probe","unitPrice":1,"active":true,"uom":"unit","imageUrl":null,"image_url":null}}' || true)"
            echo "probe_http=$CODE body=$(head -c 120 /tmp/odoo-auth.txt)"
            [[ "$FOUND" == "1" ]] || echo "no_odoo_secret_file_found_on_this_vps"
