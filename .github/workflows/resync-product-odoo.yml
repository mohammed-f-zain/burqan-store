name: Resync all products to Odoo

on:
  workflow_dispatch:

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - name: Push all products (with imageUrl) to Odoo once
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            DB_URL=""
            if [[ -f /root/.burqan-db-url ]]; then
              DB_URL="$(cat /root/.burqan-db-url | sed 's/^DATABASE_URL=//')"
            elif [[ -f packages/api/.env ]]; then
              DB_URL="$(grep -E '^DATABASE_URL=' packages/api/.env | head -1 | cut -d= -f2-)"
            fi
            SECRET="$(grep -E '^ODOO_WEBHOOK_SECRET=' packages/api/.env | head -1 | cut -d= -f2- | tr -d '\r' || true)"
            if [[ -z "${SECRET}" ]]; then
              echo "ODOO_WEBHOOK_SECRET is empty in API .env — set it to match Odoo burqan.webhook_secret"
              exit 1
            fi
            echo "ODOO_WEBHOOK_SECRET is set (value not printed)"
            BASE="$(grep -E '^ODOO_BASE_URL=' packages/api/.env | head -1 | cut -d= -f2- | tr -d '\r' || true)"
            BASE="${BASE:-https://erp.burqan.tech}"
            BASE="${BASE%/}"
            API_PUBLIC="$(grep -E '^PUBLIC_API_BASE_URL=' packages/api/.env | head -1 | cut -d= -f2- | tr -d '\r' || true)"
            API_PUBLIC="${API_PUBLIC:-https://api.burqan.store}"
            API_PUBLIC="${API_PUBLIC%/}"
            export DB_URL SECRET BASE API_PUBLIC
            python3 <<'PY'
            import json, os, subprocess, urllib.request, urllib.error

            db_url = os.environ["DB_URL"]
            secret = os.environ["SECRET"]
            base = os.environ["BASE"].rstrip("/")
            api_public = os.environ["API_PUBLIC"].rstrip("/")
            url = f"{base}/burqan/webhook/product"

            out = subprocess.check_output(
                [
                    "psql", db_url, "-t", "-A", "-F", "\t",
                    "-c",
                    "SELECT id, name, price::text, COALESCE(is_active,true), COALESCE(unit_label,''), COALESCE(image_url,'') FROM products ORDER BY id",
                ],
                text=True,
            )
            rows = [ln for ln in out.splitlines() if ln.strip()]
            ok = fail = without_image = 0
            first_fail = None
            for ln in rows:
                parts = ln.split("\t")
                if len(parts) < 6:
                    continue
                pid, name, price, active, unit, img = parts[0], parts[1], parts[2], parts[3], parts[4], parts[5]
                image_url = None
                if img:
                    image_url = img if img.startswith("http") else f"{api_public}{img if img.startswith('/') else '/' + img}"
                else:
                    without_image += 1
                uom = unit.strip() or "unit"
                active_bool = active in ("t", "true", "True", "1")
                product = {
                    "id": int(pid),
                    "name": name,
                    "sku": None,
                    "barcode": None,
                    "unitPrice": float(price),
                    "active": active_bool,
                    "uom": uom,
                    "imageUrl": image_url,
                    "image_url": image_url,
                }
                body = json.dumps({"event": "product.updated", "product": product}).encode()
                req = urllib.request.Request(
                    url,
                    data=body,
                    method="POST",
                    headers={
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                        "Authorization": f"Bearer {secret}",
                    },
                )
                try:
                    with urllib.request.urlopen(req, timeout=30) as resp:
                        code = resp.getcode()
                        resp.read(200)
                    if code in (200, 201):
                        ok += 1
                    else:
                        fail += 1
                        if first_fail is None:
                            first_fail = f"id={pid} HTTP {code}"
                except urllib.error.HTTPError as e:
                    fail += 1
                    if first_fail is None:
                        first_fail = f"id={pid} HTTP {e.code} {e.read(200)!r}"
                except Exception as e:
                    fail += 1
                    if first_fail is None:
                        first_fail = f"id={pid} {e}"

            print(f"total={len(rows)} ok={ok} fail={fail} without_image={without_image}")
            if first_fail:
                print(f"first_fail={first_fail}")

            sample = next((r for r in rows if len(r.split('\t')) > 5 and r.split('\t')[5].strip()), None)
            if sample:
                img = sample.split("\t")[5]
                test = img if img.startswith("http") else f"{api_public}{img}"
                try:
                    with urllib.request.urlopen(test, timeout=20) as resp:
                        chunk = resp.read(64)
                        print(f"image_fetch_ok status={resp.getcode()} sample_bytes={len(chunk)}")
                except Exception as e:
                    print(f"image_fetch_fail err={e}")

            if fail:
                raise SystemExit(1)
            PY
